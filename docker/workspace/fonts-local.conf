<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Font aliases for the docgen stack. Generated .docx files name modern Office
  fonts (Calibri and friends) whose proprietary faces can't ship in a Linux
  image. fontconfig-config already maps "Calibri" -> "Carlito" and
  "Cambria" -> "Caladea" via 30-metric-aliases.conf once those packages are
  installed; this file just covers the extra names a doc might use so the
  inline LibreOffice PDF preview never falls back to a serif.
  The downloaded .docx still NAMES the real font, so Word/Pages on the Mac use
  the genuine face.
-->
<fontconfig>
  <alias>
    <family>Calibri Light</family>
    <prefer><family>Carlito</family></prefer>
  </alias>
  <alias>
    <family>Helvetica Neue</family>
    <prefer><family>Carlito</family></prefer>
  </alias>
  <alias>
    <family>Aptos</family>
    <prefer><family>Carlito</family></prefer>
  </alias>
</fontconfig>
