# Railway monorepo config for Infinity.
# In the Railway dashboard, set each service's root directory to match — that
# way Railway's auto-detection finds the per-service Dockerfile cleanly.
#
#   core service    → root directory = core/
#   studio service  → root directory = studio/
#   gepa service    → root directory = docker/gepa/   (Phase-6 skill optimizer)
#   plasticity      → root directory = docker/plasticity/ (Gym worker)
#   workspace       → root directory = docker/workspace/ (cloud bridge — files + bash + git)
#   embed sidecar   → root directory = .              (uses docker/embed.Dockerfile)
#
# Postgres: use Supabase or Neon for the database — both have pgvector
# enabled. Set DATABASE_URL on the core service to the pooler URL with
# sslmode=require. Honcho uses a separate schema on the same DB.

[build]
builder = "DOCKERFILE"

[[services]]
name = "core"

[services.source]
rootDirectory = "core"

[services.build]
dockerfilePath = "Dockerfile"

[services.deploy]
startCommand = "infinity serve"
healthcheckPath = "/health"
# Boot now binds the listener in ~2-5s (slow extension/skill I/O is backgrounded),
# so /health passes almost immediately. Keep generous headroom (120s) so Railway
# holds the OLD container in service until the new one is genuinely ready —
# a clean zero-downtime overlap — instead of cutting traffic over to a box that
# isn't listening yet (which is what produced the long post-deploy "Offline").
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "studio"

[services.source]
rootDirectory = "studio"

[services.build]
dockerfilePath = "Dockerfile"

[services.deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "gepa"

[services.source]
rootDirectory = "docker/gepa"

[services.build]
dockerfilePath = "Dockerfile"

[services.deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/health"
healthcheckTimeout = 30

[[services]]
name = "plasticity"

[services.source]
rootDirectory = "docker/plasticity"

[services.build]
dockerfilePath = "Dockerfile"

[services.deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/health"
healthcheckTimeout = 30

# workspace — Jarvis's cloud filesystem bridge. Same five-primitive
# protocol as the Mac bridge (fs/save, fs/edit, bash, git/*). No LLM
# inside — Core does cognition via ChatGPT subscription OAuth. Volume
# mounted at /workspace persists across deploys and App Sleeping.
#
# Required env vars (set in Railway dashboard):
#   WORKSPACE_BRIDGE_TOKEN  shared bearer Core attaches to every call
#   GITHUB_TOKEN            PAT scoped to repo:write so `git push` works
#   GIT_USER_NAME           default "Jarvis Cloud"
#   GIT_USER_EMAIL          default "jarvis@dopesoft.io"
#
# Enable App Sleeping in the Railway service settings so it scales to
# zero when idle; Studio pre-warms via /health on Canvas mount.
[[services]]
name = "workspace"

[services.source]
rootDirectory = "docker/workspace"

[services.build]
dockerfilePath = "Dockerfile"

[services.deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/health"
healthcheckTimeout = 30

# browser — Jarvis's cloud browser bridge. Drives a real headless Chromium
# via CDP (chromedp) and exposes the observe → act → extract verb set + a
# live screencast (SSE) the boss watches in Studio's Browser tab. No LLM
# inside (Rule #1 substrate). Reachable only on the private network at
# browser.railway.internal:8080.
#
# Required env vars (set in the Railway dashboard):
#   BROWSER_BRIDGE_TOKEN   shared bearer Core attaches to every call
#                          (set the SAME value as BROWSER_BRIDGE_TOKEN on core)
# Optional:
#   BROWSER_MAX_SESSIONS   concurrent Chromium cap (default 2; lower to 1 to
#                          save memory on a scale-to-zero box)
#
# On the CORE service set:
#   BROWSER_SIDECAR_URL=http://browser.railway.internal:8080
#   BROWSER_BRIDGE_TOKEN=<same secret as here>
#
# Enable App Sleeping so it scales to zero when idle — the first browser
# call after sleep wakes it (~5-15s) and Core's HTTP client retries.
[[services]]
name = "browser"

[services.source]
rootDirectory = "docker/browser"

[services.build]
dockerfilePath = "Dockerfile"

[services.deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/health"
healthcheckTimeout = 30

# camofox — Jarvis's ANTI-DETECT browser bridge (Camoufox / Firefox). Same
# observe → act → extract verb set as `browser` above, but the engine spoofs
# device fingerprints at the C++ level so it passes Cloudflare / DataDome /
# bot-walls that block the chromedp `browser`. Core picks it ahead of the
# chromedp sidecar whenever CAMOFOX_URL / CAMOFOX_URL_MAC is set (see
# core/internal/browser + core/cmd/infinity/serve.go).
#
# docker/camofox/Dockerfile is a thin pin over the upstream GHCR image
# (ghcr.io/redf0x1/camofox-browser) — UPDATE = bump CAMOFOX_VERSION in that
# Dockerfile + redeploy; our Go adapter speaks their stable REST contract so a
# version bump touches no Go. Full runbook + Mac residential setup:
# docs/camofox/SETUP.md.
#
#   Required env on the camofox service (set in the Railway dashboard):
#     CAMOFOX_API_KEY=<secret>      # bearer guarding every interaction route
#                                   # (CAMOFOX_HOST/PORT are baked by the Dockerfile)
#   Optional (residential exit — recommended; a datacenter IP undercuts stealth):
#     PROXY_HOST / PROXY_PORT / PROXY_USERNAME / PROXY_PASSWORD
#
#   On the CORE service set:
#     CAMOFOX_URL=http://camofox.railway.internal:9377   # (auto-defaulted on Railway when CAMOFOX_API_KEY is set)
#     CAMOFOX_API_KEY=<same secret as the camofox service>
#     CAMOFOX_USER_ID=jarvis                              # optional; stable canonical fingerprint owner
#   And for the home-Mac residential instance (the strong anti-detect path):
#     CAMOFOX_URL_MAC=https://camo.dopesoft.io            # Cloudflare-Access-fronted tunnel
#     CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET       # already set for the claude_code bridge — reused
#
# Enable App Sleeping so the Cloud instance scales to zero; the first browse
# after sleep wakes it (~10-20s, Firefox cold start) and Core retries.
[[services]]
name = "camofox"

[services.source]
rootDirectory = "docker/camofox"

[services.build]
dockerfilePath = "Dockerfile"

[services.deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/health"
healthcheckTimeout = 30

# sentry — Infinity's EXTERNAL deploy watchdog. The safety net the in-core
# post-deploy-verify cron CAN'T be: when a self-improve push bricks core, the
# in-core watcher dies with it. sentry is a separate service with ZERO
# dependency on core's code; it polls core's /readyz from outside and, on a
# sustained OUTAGE (default 5 min), self-heals — Railway rollback to the last
# good deployment (instant) + git-revert the bad commit(s) on main
# (authoritative) + alert. It does NOT revert on a DB-degraded signal (that's
# infra, not a code regression).
#
# Required env on the sentry service (Railway dashboard):
#   GITHUB_TOKEN            PAT (repo:write) so the git-revert push lands on main
# Strongly recommended (instant Railway rollback; without it recovery is
# git-revert only, i.e. a full rebuild ~3-5 min):
#   RAILWAY_API_TOKEN       account/workspace token (Authorization: Bearer)
#   RAILWAY_PROJECT_ID      the Infinity project id
#   RAILWAY_CORE_SERVICE_ID the core service id
#   RAILWAY_ENVIRONMENT_ID  the production environment id
# Optional:
#   SENTRY_ALERT_WEBHOOK    URL to POST incidents to (Slack/Discord/ntfy/…)
#   SENTRY_CORE_READY_URL   default http://core.railway.internal:8080/readyz
#   SENTRY_TRIP_AFTER       default 5m   · SENTRY_POLL_INTERVAL default 60s
#   INFINITY_REPO_OWNER/NAME/BRANCH  default DopeSoft / infinity / main
#
# DO NOT enable App Sleeping — the watchdog must run continuously.
[[services]]
name = "sentry"

[services.source]
rootDirectory = "docker/sentry"

[services.build]
dockerfilePath = "Dockerfile"

[services.deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/health"
healthcheckTimeout = 30
